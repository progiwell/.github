name: Bug Report
description: Report a reproducible bug or regression
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps required to trigger the issue.
      placeholder: |
        1. Configure...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected vs. Actual Behavior
      description: What you expected to happen and what happened instead.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, browser, Docker / runtime version, and app version or commit SHA.
      placeholder: |
        - OS / Host:
        - Browser (if applicable):
        - Docker / Runtime version:
        - App version / commit SHA:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Relevant logs or screenshots (please redact API keys and tokens).
      render: shell
